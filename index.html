<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>Triagem de Reembolso</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">📮 Triagem de Reembolso</div>
    <nav class="tabs" id="tabs">
      <button data-view="inbox" class="tab active">
        Inbox <span class="badge" id="inbox-badge" hidden>0</span>
      </button>
      <button data-view="lotes" class="tab">Lotes</button>
    </nav>
    <div class="session">
      <span id="user-hint" class="user-hint"></span>
      <button id="btn-auth" class="btn btn-ghost">Entrar</button>
    </div>
  </header>

  <main id="app">
    <!-- Telas renderizadas por js/*.js -->
    <section id="view-inbox" class="view"></section>
    <section id="view-triage" class="view" hidden></section>
    <section id="view-lotes" class="view" hidden></section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <!-- SDKs do Google (globais: google, gapi). Não são módulos. -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>

  <!-- App (ES modules). A configuração fica em js/config.js. -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
